spring:
  jpa:
    hibernate:
      ddl-auto: validate # Flyway owns the schema - Hibernate only validates
    show-sql: true
  flyway:
    enabled: true
  jackson:
    datatype:
      datetime:
        write-dates-as-timestamps: false # Serialize dates as ISO-8601 strings, not epoch numbers
jwt:
  secret-key: ${JWT_SECRET_KEY}
  expiration: 86400000